<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>James's Portfolio</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 1. The Single Landing Zone for your jQuery injection -->
    <div id="nav-placeholder"></div>

    <!-- 2. Main Page Content: Bio Card -->
    <main class="container my-5">
      <div class="row justify-content-center">
        <!-- Center column: 12 cols wide on mobile, 8 on tablet, 6 on desktop -->
        <div class="col-12 col-md-8 col-lg-6">
          <!-- The rounded Card Component -->
          <div class="card p-4 shadow-sm text-center">
            <!-- Avatar / Headshot -->
            <div class="mb-3">
              <img
                src="img/profile.jpg"
                alt="Headshot photo of James"
                class="rounded-circle img-fluid"
                style="width: 150px; height: 150px; object-fit: cover"
              />
            </div>

            <!-- Card Body -->
            <div class="card-body">
              <h1 class="card-title h3 mb-3">About Me</h1>
              <p class="card-text text-start">
                Computer Science student at MSU Denver. Currently learning
                foundational systems architecture, responsive web design with
                Bootstrap 5, and programming fundamentals.
              </p>

              <!-- Action Buttons -->
              <div class="d-flex gap-2 justify-content-center mt-4">
                <a href="resume.pdf" class="btn btn-primary">Resume</a>
                <a href="portfolio.html" class="btn btn-outline-secondary"
                  >View Projects</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- 3. jQuery CDN: Must be loaded before the custom script below -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- 4. Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 5. jQuery Injection Script -->
    <script>
      $(document).ready(function () {
        $("#nav-placeholder").load("navbar.html");
      });
    </script>
  </body>
</html>
